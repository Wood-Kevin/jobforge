# Weekly dependency updates. Minor and patch version updates are grouped per ecosystem to keep PRs few;
# major updates and security updates arrive as their own PRs (groups apply to version updates only).
# Nothing merges automatically: every PR runs CI and waits for review.
version: 2
updates:
  - package-ecosystem: uv
    directory: /agent
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      # Tauri's JS packages move with the Rust crates below; keep them in one PR.
      tauri-js:
        patterns: ["@tauri-apps/*"]
        update-types: [minor, patch]
      npm-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@tauri-apps/*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      tauri-rust:
        patterns: ["tauri", "tauri-*"]
        update-types: [minor, patch]
      cargo-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["tauri", "tauri-*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
