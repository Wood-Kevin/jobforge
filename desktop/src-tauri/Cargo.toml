[package]
name = "jobforge"
version = "0.3.10"
description = "JobForge desktop host: tray, window, agent supervision. No business logic."
edition = "2021"

[lib]
name = "jobforge_host"
path = "src/lib.rs"

[[bin]]
name = "jobforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
ureq = { version = "2", features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com"] }
winreg = "0.56.0"

[profile.release]
strip = true
