- name: must work without sponsorship
  type: sponsorship
  quote: "Must be authorized to work in the US without visa sponsorship."
  facts: {sponsorship: {needs_sponsorship: true}}
  expect: {outcome: fails}

- name: sponsorship wording that is neither yes nor no is a question
  type: sponsorship
