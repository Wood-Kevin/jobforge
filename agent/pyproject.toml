[project]
name = "jobforge-agent"
version = "0.3.14"
description = "JobForge background agent: discovery, evaluation and the only owner of the SQLite database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "pypdf>=6.21.2",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
jobforge-agent = "jobforge_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobforge_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: print every skip reason (a skipped regression suite must be visible, not just an "s")
addopts = "-rs"
markers = [
  "integration: starts real agent processes (unelevated through explorer.exe when the test shell is elevated)",
  "private_config: needs the owner's private job-scanner config.yaml (JOBFORGE_SCANNER_CONFIG); not run in public CI",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
