[project]
name = "jobforge-agent"
version = "0.1.0"
description = "JobForge background agent: discovery, evaluation and the only owner of the SQLite database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
jobforge-agent = "jobforge_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobforge_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: starts real agent processes (unelevated through explorer.exe when the test shell is elevated)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
