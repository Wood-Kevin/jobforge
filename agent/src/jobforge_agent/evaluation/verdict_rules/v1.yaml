# Verdict rules v1 (ARCHITECTURE 6.3 gap materiality, 6.5 assessments and recommendation).
# Thresholds only; the rule order lives in evaluation/assess.py. Any change here is a new file
# (v2.yaml) and a new VERDICT_RULE_VERSION, so old recommendations stay reproducible and a
# recompute writes new rows with zero inference calls (SPEC D10).

gap:
  # A years shortfall is minor if short by at most this many years OR this share of the ask
  # (Q17 default: 2 years or 40%). Any other gap on a negotiable requirement is material.
  years_tolerance_abs: 2
  years_tolerance_share: 0.40

fit:
  min_judgeable: 3            # fewer judgeable negotiable requirements -> INSUFFICIENT
  max_uncertain_share: 0.30   # (unknown + unverifiable) / extracted > this -> INSUFFICIENT
  max_conflicts: 3            # more conflicts than this -> INSUFFICIENT
  strong_max_unknown: 1
  competitive_max_unknown: 2
  max_stretch_gaps: 2         # Q17 default
  stretch_max_unknown: 2      # "the rest covered": a stretch with more unknowns cannot be judged

opportunity:
  low_min_unfavorable: 2
  high_min_favorable: 3
  unknown_min_unknown: 4
  age_favorable_days: 7       # posted within a week
  age_unfavorable_days: 30    # older than a month
