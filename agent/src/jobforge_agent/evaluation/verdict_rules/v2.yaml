# Verdict rules v2: v1 plus one eligibility rule (proposed in P1.7, Kevin asked for it to be built
# and measured against v1; active only when VERDICT_RULE_VERSION says so).
#
# A hard requirement whose ONLY interpretation conflict is the eligibility type (P1.7 live: all 10
# hard conflicts in 42 postings, mostly Gemma typing a residency rule "work_authorization") is
# checked under both readings: the code's type and the model's. It counts as answered only when
# verified facts meet it under both (a model type of "none" imposes no condition of its own). Any
# other outcome stays UNKNOWN as in v1. A conflict still never blocks.

gap:
  years_tolerance_abs: 2
  years_tolerance_share: 0.40

fit:
  min_judgeable: 3
  max_uncertain_share: 0.30
  max_conflicts: 3
  strong_max_unknown: 1
  competitive_max_unknown: 2
  max_stretch_gaps: 2
  stretch_max_unknown: 2

opportunity:
  low_min_unfavorable: 2
  high_min_favorable: 3
  unknown_min_unknown: 4
  age_favorable_days: 7
  age_unfavorable_days: 30

eligibility:
  type_only_conflict: check_both   # v1 behavior: unknown
