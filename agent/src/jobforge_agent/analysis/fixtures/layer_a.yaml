- id: elig_sponsor_not_a_negation
  area: eligibility
  text: "Requirements:\n- Candidates who do not require visa sponsorship now or in the future."
  model: [{quote: "Candidates who do not require visa sponsorship now or in the future", importance: hard, eligibility_type: sponsorship}]
  expect: {"Candidates who do not require visa sponsorship now or in the future": {final_class: hard, cue_polarity: affirmative,
           interpretation_status: confirmed}}

- id: elig_lift
  area: eligibility
  # Spike: gpt-oss and qwen-fast labeled the lift line required / none.
  text: "Requirements:\n- Ability to lift 50 lbs."
  model: [{quote: "Ability to lift 50 lbs"}]
  expect: {"Ability to lift 50 lbs": {final_class: hard, interpretation_status: conflict, eligibility_type: physical}}

- id: elig_travel
  area: eligibility
  text: "Requirements:\n- Willingness to travel up to 25%."
  model: [{quote: "Willingness to travel up to 25%", eligibility_type: travel}]
  expect: {"Willingness to travel up to 25%": {final_class: hard, interpretation_status: confirmed, eligibility_type: travel}}

- id: elig_model_hard_skill
  area: eligibility
  # D6: however strongly worded, a skill is at most negotiable.
  text: "Requirements:\n- Must have 5+ years of Linux administration."
  model: [{quote: "Must have 5+ years of Linux administration", importance: hard, min_years: 5}]
  expect: {"Must have 5+ years of Linux administration": {final_class: negotiable, interpretation_status: confirmed,
           eligibility_type: null, flags: [model_hard_without_eligibility_type]}}

- id: quote_not_found
  area: quote
  text: "Requirements:\n- 3+ years of Linux experience."
  model: [{quote: "5+ years of Windows Server experience", min_years: 5}]
  expect: {"5+ years of Windows Server experience": {quote_found: false, interpretation_status: unverifiable,
           final_class: negotiable, section_label: null, flags: [quote_not_found]}}

- id: quote_not_found_never_hard
  area: quote
  text: "Requirements:\n- 3+ years of Linux experience."
  model: [{quote: "Must be a US citizen", importance: hard, eligibility_type: work_authorization}]
  expect: {"Must be a US citizen": {quote_found: false, interpretation_status: unverifiable, final_class: negotiable,
           eligibility_type: null}}
  recall: []

- id: quote_with_curly_apostrophe
  area: quote
  text: "Requirements:\n- You’ll need hands‑on Linux experience."
  model: [{quote: "You'll need hands-on Linux experience"}]
  expect: {"You'll need hands-on Linux experience": {quote_found: true, interpretation_status: confirmed}}

- id: quote_two_sections_disagree
  area: quote
  text: "Requirements:\n- AWS certification\n\nBenefits:\n- AWS certification"
  model: [{quote: "AWS certification"}]
  expect: {"AWS certification": {quote_found: true, quote_occurrences: 2, interpretation_status: unverifiable, flags: [ambiguous_location]}}

- id: quote_two_sections_agree
  area: quote
  text: "Requirements:\n- Linux administration\n\nResponsibilities:\n- Linux administration"
  model: [{quote: "Linux administration"}]
  expect: {"Linux administration": {quote_occurrences: 2, interpretation_status: confirmed, section_label: requirements,
           flags: [ambiguous_location]}}

- id: recall_skillbridge_missed
  area: recall
  # Spike: Gemma missed the SkillBridge active-duty condition entirely.
  text: "Requirements:\n- Active-duty military service member approved to participate in the DoD SkillBridge program.\n- Working knowledge of networking fundamentals."
  model: [{quote: "Working knowledge of networking fundamentals"}]
  expect: {"Working knowledge of networking fundamentals": {final_class: negotiable, interpretation_status: confirmed}}
  recall: [program_status]

- id: recall_skillbridge_extracted
  area: recall
  text: "Requirements:\n- Active-duty military service member approved to participate in the DoD SkillBridge program."
  model: [{quote: "Active-duty military service member approved to participate in the DoD SkillBridge program", importance: hard,
           eligibility_type: work_authorization}]
  expect: {"Active-duty military service member approved to participate in the DoD SkillBridge program":
           {final_class: hard, eligibility_type: program_status, interpretation_status: confirmed, flags: [model_type_without_cue]}}
  recall: []

- id: recall_covers_only_the_extracted_type
  area: recall
  text: "Requirements:\n- Bachelor's degree and US citizenship required."
  model: [{quote: "Bachelor's degree"}]
  expect: {"Bachelor's degree": {final_class: negotiable, eligibility_type: null}}
  recall: [work_authorization]

- id: recall_after_unknown_heading
  area: recall
  # E0: a heading the lexicon does not know still ends the benefits section before it.
  text: "Compensation\n\nThe annual salary is $100,000.\n\nLogistics\n\nVisa sponsorship: We do sponsor visas for this role."
  model: []
  recall: [sponsorship]

- id: privacy_notice_subheadings
  area: recall
  text: "Candidate Privacy Notice\n\nInformation you provide:\n\nEmployment history, qualifications, work eligibility and citizenship status."
  model: []
  recall: []

- id: benefits_perk_is_context
  area: subject
  text: "Benefits:\n- Gym membership reimbursement up to $50 per month."
  model: [{quote: "Gym membership reimbursement up to $50 per month"}]
  expect: {"Gym membership reimbursement up to $50 per month": {final_class: context, interpretation_status: conflict, cue_subject: benefit}}

- id: benefits_section_residency_extracted
  area: eligibility
  # P1.6 live (Company Y): the location rule sits under "Benefits:". It must stay a requirement.
  text: "Benefits:\n- Medical, dental and vision.\n- This role is fully remote; candidates for this role must be based in the US."
  model: [{quote: "candidates for this role must be based in the US", importance: hard, eligibility_type: residency}]
  expect: {"candidates for this role must be based in the US": {final_class: hard, interpretation_status: confirmed,
           eligibility_type: residency, cue_subject: candidate, flags: [eligibility_in_context_section]}}

- id: compensation_section_residency_missed
  area: recall
  # P1.6 live (Company U): the state list sits under "Compensation"; the recall scan must see it.
  text: "Compensation\n\nThe salary range is $80,000 to $100,000.\n\nWe are currently accepting applications from candidates residing in the following states: Florida, Texas."
  model: []
  recall: [residency]

- id: no_headings
  area: segment
  text: "Must be a US citizen. You will monitor the network."
  model: [{quote: "Must be a US citizen", importance: hard, eligibility_type: work_authorization}]
  expect: {"Must be a US citizen": {final_class: hard, interpretation_status: confirmed, section_label: unknown}}
  headings: 0

- id: secret_as_ordinary_word
  area: recall
  # P1.6 dry run on 42 real postings: Company R's "secret weapon" read as a clearance.
  text: "About Company R\n\nWe believe our globally distributed team is our secret weapon.\n\nRequirements:\n- Experience with secrets management."
  model: []
  recall: []

- id: secret_clearance_still_detected
  area: recall
  text: "Requirements:\n- Active Secret clearance.\n- Secret or higher preferred for the second shift."
  model: []
  recall: [clearance, clearance]

- id: quote_joins_lead_in_and_bullet
  area: quote
  # P1.6 live (Company U, Gemma): lead-in line joined to one of its bullets, across a blank line.
  text: "Qualifications\n\nDemonstrated understanding of:\n\n - Load balancing concepts\n\n - Core networking concepts"
  model: [{quote: "Demonstrated understanding of:\n\n - Core networking concepts"}]
  expect: {"Demonstrated understanding of:\n\n - Core networking concepts": {quote_found: true, interpretation_status: confirmed,
           final_class: negotiable, section_label: requirements, flags: [heading_joined_quote]}}

- id: quote_joins_lead_in_inline
  area: quote
  # Spike P1.0b (gpt-oss): the same join on one line.
  text: "Requirements:\n- 3+ years of IT support.\n\nHands-on experience configuring and supporting:\n- Firewalls\n- Load balancers"
  model: [{quote: "Hands-on experience configuring and supporting: Firewalls"}, {quote: "Hands-on experience configuring and supporting: Load balancers"}]
  expect:
    # Directly after the lead-in the joined text is verbatim; a later bullet needs the join rule.
    "Hands-on experience configuring and supporting: Firewalls": {quote_found: true, no_flags: [heading_joined_quote]}
    "Hands-on experience configuring and supporting: Load balancers": {quote_found: true, section_label: requirements, flags: [heading_joined_quote]}

- id: quote_joins_lead_in_with_its_modality
  area: quote
  # The second bullet needs the join rule; the lead-in's "must" is then read (the bullet alone has
  # no wording): a must inside a Preferred section is a conflict, preferred for fit (check 3).
  text: "Nice to have:\n- Python.\n\nYou must hold one of:\n- An active TS/SCI clearance\n- An active Secret clearance"
  model: [{quote: "You must hold one of:\n- An active Secret clearance", importance: hard, eligibility_type: clearance}]
  expect: {"You must hold one of:\n- An active Secret clearance": {final_class: preferred, interpretation_status: conflict,
           eligibility_type: clearance, flags: [heading_joined_quote, required_wording_in_preferred_section]}}

- id: quote_joins_lead_in_from_another_list
  area: quote
  # The bullet is under a different lead-in: not located.
  text: "Demonstrated understanding of:\n- Virtualization\n\nNice to have:\n\nFamiliarity with:\n- Core networking concepts"
  model: [{quote: "Demonstrated understanding of: Core networking concepts"}]
  expect: {"Demonstrated understanding of: Core networking concepts": {quote_found: false, interpretation_status: unverifiable}}

- id: context_rows_ignore_importance_disagreement
  area: subject
  # P1.6 live (Company U): a perk the model called required with subject benefit.
  text: "Benefits:\n- Increased PTO at 3 year anniversary + Anniversary Bonus each year"
  model: [{quote: "Increased PTO at 3 year anniversary + Anniversary Bonus each year", subject: benefit}]
  expect: {"Increased PTO at 3 year anniversary + Anniversary Bonus each year": {final_class: context, interpretation_status: confirmed,
           flags: [disagreement_ignored_for_context]}}

- id: bullets_inherit_lead_in_wording
  area: importance
  # P1.6 live (Company Z): a preferred list inside the Requirements section.
  text: "What you bring\n\n- Excellent problem-solving skills\n\nFamiliarity with several of the following areas is preferred:\n\n- NGINX\n\n- SQL\n\nAbility to work remotely."
  model: [{quote: "NGINX", importance: preferred}, {quote: "Excellent problem-solving skills"}, {quote: "Ability to work remotely"}]
  expect:
    NGINX: {final_class: preferred, interpretation_status: confirmed, flags: [wording_overrides_section]}
    "Excellent problem-solving skills": {final_class: negotiable, interpretation_status: confirmed}
    "Ability to work remotely": {final_class: negotiable, interpretation_status: confirmed}

