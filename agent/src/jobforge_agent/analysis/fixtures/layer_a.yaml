# ARCHITECTURE 6.6 layer A: interpreter (E0 + E2) cases, no model.
# Each case: a posting snippet, the E1 reading a model plausibly produces (several are the
# actual errors models made in spike P1.0b, Appendix A), and the expected E2 output.
#   model:  E1 items. Defaults: importance required, polarity affirmative, subject candidate,
#           eligibility_type none, min_years null, text = quote.
#   expect: per model quote, fields of the stored requirement row ("flags" = flag names that must
#           be present, "no_flags" = names that must be absent).
#   recall: eligibility types of the expected unextracted_eligibility rows, in sentence order.
# Synthetic text only: no personal data.

- id: neg_cloud
  area: negation
  text: "Requirements:\n- No prior cloud experience required."
  model: [{quote: "No prior cloud experience required", polarity: negated}]
  expect: {"No prior cloud experience required": {final_class: negated, interpretation_status: confirmed, cue_polarity: negated}}

- id: neg_cloud_model_misses_negation
  area: negation
  text: "Requirements:\n- No prior cloud experience required."
  model: [{quote: "No prior cloud experience required"}]
  expect: {"No prior cloud experience required": {final_class: negated, interpretation_status: conflict,
           model_polarity: affirmative, cue_polarity: negated, flags: [conflict]}}

- id: neg_degree
  area: negation
  text: "Qualifications:\n- A degree is not required."
  model: [{quote: "A degree is not required", polarity: negated}]
  expect: {"A degree is not required": {final_class: negated, interpretation_status: confirmed}}

- id: neg_k8s
  area: negation
  text: "What you'll need:\n- You don't need Kubernetes on day one; we'll train you."
  model: [{quote: "You don't need Kubernetes on day one", polarity: negated}]
  expect: {"You don't need Kubernetes on day one": {final_class: negated, interpretation_status: confirmed, section_label: requirements}}

- id: neg_mixed_clearance
  area: negation
  # Spike: every model labeled this hard.
  text: "Requirements:\n- Clearance not required, but must be able to obtain a Secret clearance."
  model: [{quote: "must be able to obtain a Secret clearance", importance: hard, eligibility_type: clearance}]
  expect: {"must be able to obtain a Secret clearance": {final_class: negotiable, interpretation_status: confirmed,
           eligibility_type: clearance, cue_polarity: affirmative, flags: [ability_to_obtain], no_flags: [clearance_held]}}

- id: imp_ccna_required
  area: importance
  text: "Requirements:\n- CCNA certification required."
  model: [{quote: "CCNA certification required"}]
  expect: {"CCNA certification required": {final_class: negotiable, interpretation_status: confirmed, cue_importance: required}}

- id: imp_ccna_plus
  area: importance
  text: "Nice to have:\n- CCNA certification is a plus."
  model: [{quote: "CCNA certification is a plus", importance: preferred}]
  expect: {"CCNA certification is a plus": {final_class: preferred, interpretation_status: confirmed, section_label: preferred}}

- id: imp_ccna_equivalent
  area: importance
  text: "Requirements:\n- CCNA or equivalent experience."
  model: [{quote: "CCNA or equivalent experience"}]
  expect: {"CCNA or equivalent experience": {final_class: negotiable, interpretation_status: confirmed, flags: [equivalence]}}

- id: imp_must_in_nice_to_have
  area: importance
  # Spike: every model read this as required.
  text: "Nice to have:\n- Must have AWS experience."
  model: [{quote: "Must have AWS experience"}]
  expect: {"Must have AWS experience": {final_class: preferred, interpretation_status: conflict,
           flags: [required_wording_in_preferred_section, conflict]}}

- id: imp_plus_under_qualifications
  area: importance
  # Spike reference (Company U): wording beats the heading; not a conflict when the model agrees.
  text: "Qualifications:\n- Experience with virtualization, networking, or software development is a plus."
  model: [{quote: "Experience with virtualization, networking, or software development is a plus", importance: preferred}]
  expect: {"Experience with virtualization, networking, or software development is a plus":
           {final_class: preferred, interpretation_status: confirmed, flags: [wording_overrides_section]}}

- id: imp_parenthetical_preference
  area: importance
  # Spike reference (Company X): "preferably" qualifies the language, not the requirement.
  text: "Requirements:\n- Ability to use scripting languages (preferably Ruby or Bash)."
  model: [{quote: "Ability to use scripting languages (preferably Ruby or Bash)"}]
  expect: {"Ability to use scripting languages (preferably Ruby or Bash)": {final_class: negotiable, interpretation_status: confirmed}}

- id: imp_degree_or_years
  area: importance
  text: "Requirements:\n- Bachelor's degree or 4 additional years of relevant experience."
  model: [{quote: "Bachelor's degree or 4 additional years of relevant experience"}]
  expect: {"Bachelor's degree or 4 additional years of relevant experience": {final_class: negotiable,
           interpretation_status: confirmed, flags: [equivalence, years]}}

- id: years_two_branches
  area: years
  text: "Requirements:\n- 5 years of experience with a degree or 7 without."
  model: [{quote: "5 years of experience with a degree or 7 without", min_years: 5}]
  expect: {"5 years of experience with a degree or 7 without": {final_class: negotiable, interpretation_status: confirmed,
           min_years: 5, years: [5, 7]}}

- id: years_word_number
  area: years
  text: "Requirements:\n- Four or more years of experience in software development."
  model: [{quote: "Four or more years of experience in software development", min_years: 4}]
  expect: {"Four or more years of experience in software development": {min_years: 4, years: [4], no_flags: [years_disagree]}}

- id: subj_customers
  area: subject
  text: "About us:\nOur customers include Fortune 500 banks."
  model: [{quote: "Our customers include Fortune 500 banks"}]
  expect: {"Our customers include Fortune 500 banks": {final_class: context, interpretation_status: conflict, cue_subject: company}}

- id: subj_customers_model_agrees
  area: subject
  text: "About us:\nOur customers include Fortune 500 banks."
  model: [{quote: "Our customers include Fortune 500 banks", subject: company}]
  expect: {"Our customers include Fortune 500 banks": {final_class: context, interpretation_status: confirmed}}

- id: subj_stack
  area: subject
  # Spike: Gemma read the stack line as three required skills.
  text: "About the team:\nOur stack: Terraform, Ansible, Datadog."
  model: [{quote: "Terraform"}, {quote: "Ansible"}, {quote: "Datadog"}]
  expect:
    Terraform: {final_class: context, interpretation_status: conflict, section_label: about}
    Ansible: {final_class: context, interpretation_status: conflict}
    Datadog: {final_class: context, interpretation_status: conflict}

- id: subj_stack_no_heading
  area: subject
  text: "Our stack: Terraform, Ansible, Datadog."
  model: [{quote: "Our stack: Terraform, Ansible, Datadog"}]
  expect: {"Our stack: Terraform, Ansible, Datadog": {final_class: context, interpretation_status: conflict, flags: [company_statement]}}

- id: subj_mentor_years
  area: subject
  text: "Responsibilities:\n- You'll mentor engineers with 10+ years of experience."
  model: [{quote: "mentor engineers with 10+ years of experience", min_years: 10}]
  expect: {"mentor engineers with 10+ years of experience": {final_class: context, interpretation_status: conflict,
           cue_subject: team, flags: [years_about_others]}}

- id: subj_benefit_cert
  area: subject
  text: "Benefits:\n- We pay for AWS certifications."
  model: [{quote: "We pay for AWS certifications"}]
  expect: {"We pay for AWS certifications": {final_class: context, interpretation_status: conflict, cue_subject: benefit}}

- id: eeo_section
  area: eeo
  text: "Equal opportunity:\nWe do not discriminate on the basis of race, religion, citizenship, or veteran status."
  model: []
  recall: []

- id: eeo_model_extracts_citizenship
  area: eeo
  text: "Equal opportunity:\nWe do not discriminate on the basis of race, religion, citizenship, or veteran status."
  model: [{quote: "citizenship", importance: hard, eligibility_type: work_authorization}]
  expect: {"citizenship": {final_class: context, interpretation_status: conflict, flags: [context_section], no_flags: [subject_conflict_kept_for_eligibility]}}
  recall: []

- id: eeo_without_heading
  area: eeo
  text: "We are an equal opportunity employer and do not discriminate based on citizenship or protected veteran status."
  model: []
  recall: []

- id: elig_citizen
  area: eligibility
  text: "Requirements:\n- Must be a US citizen."
  model: [{quote: "Must be a US citizen", importance: hard, eligibility_type: work_authorization}]
  expect: {"Must be a US citizen": {final_class: hard, interpretation_status: confirmed, eligibility_type: work_authorization}}

- id: elig_citizen_model_says_clearance
  area: eligibility
  # Spike: gpt-oss and qwen-think read Company X's citizenship line as clearance. interp-v8: both call it a condition
  # and the wording shows only the code's kind, so the code's is checked (was a conflict, eligibility UNKNOWN).
  text: "Requirements:\n- Must be a US citizen."
  model: [{quote: "Must be a US citizen", importance: hard, eligibility_type: clearance}]
  expect: {"Must be a US citizen": {final_class: hard, interpretation_status: confirmed, eligibility_type: work_authorization,
           model_eligibility_type: clearance, flags: [model_type_without_cue], no_flags: [conflict]}}

- id: elig_model_says_no_condition_is_still_a_conflict
  area: eligibility
  # interp-v8 changes only a disagreement on the kind of condition; "no condition" against a cue stays a conflict.
  text: "Requirements:\n- Must be a US citizen."
  model: [{quote: "Must be a US citizen", importance: required}]
  expect: {"Must be a US citizen": {interpretation_status: conflict, eligibility_type: work_authorization,
           flags: [conflict], no_flags: [model_type_without_cue]}}

- id: elig_tssci_held
  area: eligibility
  text: "Requirements:\n- Active TS/SCI clearance required."
  model: [{quote: "Active TS/SCI clearance required", importance: hard, eligibility_type: clearance}]
  expect: {"Active TS/SCI clearance required": {final_class: hard, interpretation_status: confirmed, eligibility_type: clearance,
           flags: [clearance_held]}}

- id: elig_obtain_secret
  area: eligibility
  text: "Requirements:\n- Ability to obtain a Secret clearance."
  model: [{quote: "Ability to obtain a Secret clearance", importance: hard, eligibility_type: clearance}]
  expect: {"Ability to obtain a Secret clearance": {final_class: negotiable, eligibility_type: clearance, flags: [ability_to_obtain]}}

- id: elig_reside
  area: eligibility
  text: "Requirements:\n- Must reside in Northern California."
  model: [{quote: "Must reside in Northern California", importance: hard, eligibility_type: residency}]
  expect: {"Must reside in Northern California": {final_class: hard, interpretation_status: confirmed, eligibility_type: residency}}

- id: elig_reside_model_says_work_authorization
  area: eligibility
  # Spike: Gemma read both residency blockers (Company U, Company L) as work_authorization.
  text: "Requirements:\n- Must reside within reasonable commuting distance of our Los Angeles office."
  model: [{quote: "Must reside within reasonable commuting distance of our Los Angeles office", importance: hard,
           eligibility_type: work_authorization}]
  expect: {"Must reside within reasonable commuting distance of our Los Angeles office": {final_class: hard,
           interpretation_status: confirmed, eligibility_type: residency, flags: [model_type_without_cue]}}

